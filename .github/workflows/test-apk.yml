name: Build Test APK

# 给开发分支打测试包，用仓库自带的 debug.keystore 签名，不需要配置任何 secrets
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE='debug.keystore' -PMYAPP_UPLOAD_KEY_ALIAS='androiddebugkey' -PMYAPP_UPLOAD_STORE_PASSWORD='android' -PMYAPP_UPLOAD_KEY_PASSWORD='android'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
