# 本地音乐：打开下载页，截图本地音乐标签、播放、多选、下载任务标签
appId: cn.toside.music.mobile
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "我知道了.*"
    optional: true
- extendedWaitUntil:
    visible: "^接受$"
    timeout: 30000
    optional: true
- tapOn:
    text: "^接受$"
    optional: true
- waitForAnimationToEnd
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "(我知道了|好的).*"
          optional: true
      - waitForAnimationToEnd
- tapOn:
    point: "7%,8%"
- waitForAnimationToEnd
- takeScreenshot: local-00-drawer
- tapOn: "下载管理"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "夜曲"
    timeout: 15000
    optional: true
- takeScreenshot: local-01-list
- tapOn: "夜曲"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: local-02-playing
- longPressOn: "some_song_without_tags"
- waitForAnimationToEnd
- takeScreenshot: local-03-multiselect
- tapOn: "^取消$"
- waitForAnimationToEnd
- tapOn: "排序.*"
- waitForAnimationToEnd
- takeScreenshot: local-04-sort
- tapOn: "歌名"
- waitForAnimationToEnd
- tapOn: "下载任务.*"
- waitForAnimationToEnd
- takeScreenshot: local-05-tasks
